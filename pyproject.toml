[project]
name = "logo-lens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "motor>=3.4",           # async MongoDB driver
    "elasticsearch[async]>=8.13,<9",
    "transformers>=4.40",
    "torch>=2.3",
    "Pillow>=10.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
